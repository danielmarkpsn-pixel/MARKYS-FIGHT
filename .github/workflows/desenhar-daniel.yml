name: Produzir sprites desenhados do Daniel
on:
  push:
    branches: [main]
    paths:
      - 'tools/draw_daniel_frames.py'
      - '.github/workflows/desenhar-daniel.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar renderizador
        run: python -m pip install "Pillow==11.3.0" "CairoSVG==2.8.2"
      - name: Desenhar quadros e exportar PNG
        run: python tools/draw_daniel_frames.py
      - name: Validar integridade e jogabilidade
        run: |
          python tools/validate_daniel_sprites.py
          python tests/test_daniel_combat.py
      - name: Guardar pacote para revisão artística
        uses: actions/upload-artifact@v4
        with:
          name: daniel-sprites-desenhados
          path: personagens/DANIEL/sprites/*.png
      - name: Publicar sprites no repositório main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personagens/DANIEL/sprites/*.png personagens/DANIEL/config.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(daniel): publicar 19 spritesheets desenhados"
            git push origin HEAD:main
          fi
