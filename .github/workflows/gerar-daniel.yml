name: Gerar sprites do Daniel
on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_daniel_sprites.py'
      - '.github/workflows/gerar-daniel.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Gerar os 19 spritesheets
        run: python tools/generate_daniel_sprites.py
      - name: Validar sprites e configurações
        run: python tools/validate_daniel_sprites.py
      - name: Publicar os sprites na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personagens/DANIEL/sprites/*.png personagens/DANIEL/config.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(daniel): gerar 19 spritesheets PNG a partir do original"
            git push origin HEAD:main
          fi
