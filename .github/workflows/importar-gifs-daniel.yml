name: Importar GIFs reais do Daniel
on:
  push:
    branches: [main]
    paths:
      - 'personagens/DANIEL/gifs/**'
      - 'tools/import_gif_animations.py'
      - 'tests/test_daniel_combat.py'
      - '.github/workflows/importar-gifs-daniel.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sprites-gifs-daniel-main
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Conferir GIFs disponíveis
        run: python tools/import_gif_animations.py DANIEL --dry-run
      - name: Converter GIFs originais em spritesheets PNG
        run: python tools/import_gif_animations.py DANIEL
      - name: Validar integração
        run: |
          python tools/validate_daniel_sprites.py
          python tests/test_daniel_combat.py
          node --test tests/sprites.test.cjs
      - name: Salvar conjunto de sprites
        uses: actions/upload-artifact@v4
        with:
          name: daniel-gifs-importados
          path: |
            personagens/DANIEL/config.json
            personagens/DANIEL/sprites/*.png
      - name: Publicar atualização diretamente na main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add personagens/DANIEL/config.json personagens/DANIEL/sprites/
          if ! git diff --cached --quiet; then
            git commit -m 'assets(daniel): integrar GIFs originais no motor do jogo'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
