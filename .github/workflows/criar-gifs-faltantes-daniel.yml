name: Criar sete GIFs faltantes do Daniel
on:
  push:
    branches: [main]
    paths:
      - 'tools/create_missing_daniel_gifs.py'
      - 'tools/draw_daniel_frames.py'
      - '.github/workflows/criar-gifs-faltantes-daniel.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  criar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas de desenho
        run: python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2'
      - name: Criar GIFs transparentes faltantes
        run: python tools/create_missing_daniel_gifs.py
      - name: Publicar GIFs na main sem alterar originais
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add personagens/DANIEL/gifs/*.gif
          if ! git diff --cached --quiet; then
            git commit -m 'assets(daniel): adicionar sete GIFs de movimentos faltantes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
